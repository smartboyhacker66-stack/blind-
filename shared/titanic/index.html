<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Titanic: Survive</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; background: #0b1218; color: #f2f5f7; font: 18px/1.5 system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  #clock { margin: 8px 0; padding: 10px; border: 1px solid #4a5560; border-radius: 8px; }
  #story { margin: 12px 0; padding: 12px; border-left: 4px solid #5aa9e6; background: #121d27; border-radius: 4px; min-height: 3em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px; margin: 12px 0; }
  button { min-height: 64px; font-size: 18px; border-radius: 8px; border: 2px solid #6b7a88; background: #1c242c; color: #f2f5f7; padding: 8px 12px; }
  button:focus-visible { outline: 4px solid #ffd54a; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<h1 id="title" tabindex="-1">Titanic: Survive</h1>
<div id="clock" tabindex="0"></div>
<div id="story" tabindex="0"></div>
<div id="controls" class="grid"></div>
<div id="live" class="sr-only" aria-live="assertive" aria-atomic="true" role="status"></div>
<script src="../common/hubaudio.js"></script>
<script src="story.js"></script>
<script src="titanic.js"></script>
</body>
</html>
