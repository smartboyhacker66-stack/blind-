plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.blindindiantech.blindcarrom'
    compileSdk 36

    defaultConfig {
        applicationId "com.blindindiantech.blindcarrom"
        minSdk 24
        targetSdk 36
        versionCode 35
        versionName "4.16"
    }

    // Play Store के लिए हस्ताक्षर: चाबी GitHub Secrets से आती है (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
    // चाबी न मिले तो release बिल्ड debug चाबी से हस्ताक्षर होता है (सिर्फ़ फ़ोन पर इंस्टॉल के लिए, Play Store के लिए नहीं).
    def ksFile = System.getenv("KEYSTORE_FILE")
    def hasKey = ksFile != null && file(ksFile).exists()
    signingConfigs {
        if (hasKey) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
