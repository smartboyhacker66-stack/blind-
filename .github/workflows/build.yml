name: Build Blind Hub (Windows exe + Android signed apk/aab)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signing key (only if the secret exists)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. The release APK will use the debug key and is NOT valid for Play Store."
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
      - name: Build release APK and AAB
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/BlindHub-release-signed-$SIGNED.apk"
          cp app/build/outputs/bundle/release/*.aab "out/BlindHub-playstore-signed-$SIGNED.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: BlindHub-android
          path: out/*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install
      - name: Build Windows exe (installer + portable)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BlindHub-windows-exe
          path: electron/dist/*.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Blind Hub build ${{ github.run_number }}
          make_latest: true
          files: |
            out/BlindHub-android/*
            out/BlindHub-windows-exe/*.exe
