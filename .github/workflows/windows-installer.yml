name: Windows installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python packages
        working-directory: windows
        run: pip install -r requirements.txt

      - name: Build BlindHub.exe
        working-directory: windows
        run: pyinstaller --noconfirm --onefile --windowed --name BlindHub --add-data "blind-hub.html;." app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        working-directory: windows
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: BlindHub-Windows-Setup
          path: windows/output/BlindHub-Setup.exe
